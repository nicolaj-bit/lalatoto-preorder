name: Tests

on:
  push:
  pull_request:

jobs:
  enhedstests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Integrationstesten springes over her: den kræver SHOPIFY_STORE og
      # appens nøgler, og dem har CI ikke.
      - run: npm run test:integration
