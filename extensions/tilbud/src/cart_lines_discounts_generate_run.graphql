# Produktets tilbud i procent ligger i metafeltet lalatoto.tilbud
# («Tilbud i procent» under produktet i admin).
query CartInput {
  cart {
    lines {
      id
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            tilbud: metafield(namespace: "lalatoto", key: "tilbud") {
              value
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
