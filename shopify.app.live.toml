# Produktionsappen til lalatoto.dk. Testappen på felt-post ligger i shopify.app.toml.

client_id = "3d9403c7e9bc3df3a886bc3c6d945bc6"
name = "Lalatoto Forudbestilling Live"
# Appen har ingen egen Remix-server: serveren er Base44 (se README). Appens
# forside er dashboardet i admin-app/ på Vercel, og den åbner inde i admin.
# Base44-siden kan ikke bruges her: den må ikke vises inde i Shopify.
# Produktionsappen bruger live/, som har sit eget Client ID til App Bridge.
application_url = "https://lalatoto-preorder-admin-app.vercel.app/live/"
embedded = true

[access_scopes]
# Se docs/forudsaetninger.md for hvorfor hvert scope er her.
# read_all_orders og *_payment_mandate kræver Shopifys godkendelse pr. app i
# Partner Dashboard (afsnit 1.2). Testappen er godkendt; en ny app skal søge selv.
# customer_read_* er kundekontoens egne adgange; Shopifys eksempel på en knap
# i ordrens handlingsmenu har dem.
# write_payment_terms og write_merchant_managed_fulfillment_orders flytter
# forfalds- og klargøringsdatoen på lagte ordrer, når datoen ændres.
# write_customers opretter kundesegmentet pr. produkt fra dashboardet
# (segmentCreate). Appen ændrer ikke selve kunderne.
# write_discounts: rabatten «Tilbud i procent» (extensions/tilbud) vises kun
# under Rabatter → Opret rabat, når appen har adgang til rabatter.
scopes = "write_discounts,write_products,read_products,write_purchase_options,read_purchase_options,read_orders,write_orders,read_all_orders,read_customers,write_customers,read_payment_terms,read_payment_mandate,write_payment_mandate,read_publications,write_publications,customer_read_orders,customer_read_customers,write_payment_terms,write_merchant_managed_fulfillment_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

# Webhooks fra skabelonen pegede på Remix-serveren og er taget ud.
[webhooks]
api_version = "2026-04"

[auth]
redirect_urls = [ ]
